<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图像处理助手</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            background-color: white; /* 白色背景 */
            color: #333;
        }

        /* 左侧面板 */
        .left-panel {
            width: 300px; /* 固定宽度 */
            padding: 20px;
            border-right: 1px solid #eee;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* 使底部文本靠下 */
            background-color: #f8f8f8;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
            position: relative;
        }

        .upload-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* 左上角对齐 */
            margin-bottom: 20px;
        }

        .upload-button {
            background-color: #007bff; /* 蓝色按钮 */
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.2s;
            margin-bottom: 15px;
        }
        .upload-button:hover {
            background-color: #0056b3;
        }
        .upload-button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        /* 文件列表 */
        #file-list {
            margin-top: 10px;
            font-size: 0.9em;
            color: #555;
            max-height: 200px;
            overflow-y: auto;
            border-top: 1px dashed #ddd;
            padding-top: 10px;
        }
        #file-list div {
            padding: 5px 0;
            border-bottom: 1px dotted #eee;
        }
        #file-list div:last-child {
            border-bottom: none;
        }
        .loading-indicator {
            margin-top: 15px;
            color: #007bff;
            font-weight: bold;
            display: none; /* 默认隐藏 */
        }
        .loading-indicator::before {
            content: "处理中...";
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            from { opacity: 0.6; }
            to { opacity: 1; }
        }

        /* 右侧面板 */
        .right-panel {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: #fcfcfc;
            overflow: hidden; /* 防止图片溢出 */
        }

        #image-display {
            max-width: 100%;
            max-height: calc(100vh - 100px); /* 留出翻页按钮空间 */
            object-fit: contain; /* 保持图片比例 */
            border: 1px solid #ddd;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .pagination {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            display: none; /* 默认隐藏 */
        }
        .pagination button {
            background-color: #6c757d; /* 灰色按钮 */
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 0.9rem;
        }
        .pagination button:hover {
            background-color: #5a6268;
        }
        .pagination button:disabled {
            background-color: #e0e0e0;
            cursor: not-allowed;
            color: #888;
        }
        #page-info {
            line-height: 36px; /* 与按钮对齐 */
            font-size: 0.9rem;
            color: #555;
        }

        /* 左下角署名 */
        .footer-credit {
            position: absolute;
            bottom: 10px;
            left: 20px;
            font-size: 0.75em;
            color: #aaa; /* 淡色小字 */
        }
    </style>
</head>
<body>

    <div class="left-panel">
        <div class="upload-area">
            <input type="file" id="image-upload" accept="image/*" multiple style="display: none;">
            <button class="upload-button" id="select-files-btn">选择图片上传</button>
            <div id="file-list"></div>
            <div class="loading-indicator" id="loading-spinner"></div>
        </div>
        <div class="footer-credit">本网页前端由 Assistant 提供</div>
    </div>

    <div class="right-panel">
        <img id="image-display" src="" alt="处理后的图片将在此显示">
        <div class="pagination">
            <button id="prev-btn" disabled>&lt; 上一页</button>
            <span id="page-info"></span>
            <button id="next-btn" disabled>下一页 &gt;</button>
        </div>
    </div>

    <script>
        const selectFilesBtn = document.getElementById('select-files-btn');
        const imageUploadInput = document.getElementById('image-upload');
        const fileListDiv = document.getElementById('file-list');
        const loadingSpinner = document.getElementById('loading-spinner');
        const imageDisplay = document.getElementById('image-display');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const pageInfoSpan = document.getElementById('page-info');
        const paginationDiv = document.getElementById('pagination');

        let processedImages = [];
        let currentPageIndex = 0;

        selectFilesBtn.addEventListener('click', () => {
            imageUploadInput.click();
        });

        imageUploadInput.addEventListener('change', async (event) => {
            const files = event.target.files;
            if (files.length === 0) return;

            fileListDiv.innerHTML = '';
            processedImages = [];
            currentPageIndex = 0;
            imageDisplay.src = '';
            paginationDiv.style.display = 'none'; // 隐藏翻页器

            loadingSpinner.style.display = 'block';
            selectFilesBtn.disabled = true;
            fileListDiv.innerHTML += `<div>共选中 ${files.length} 张图片</div>`;

            // 循环处理每张图片
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                fileListDiv.innerHTML += `<div>处理中：${file.name}</div>`;

                const formData = new FormData();
                formData.append('image', file);

                try {
                    // 假设后端接口为 /process-image，返回处理后的图片数据
                    const response = await fetch('/process-image', {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(`处理 ${file.name} 失败: ${response.status} - ${errorText}`);
                    }

                    // 将处理后的图片作为 Blob URL 存储
                    const imageBlob = await response.blob();
                    processedImages.push(URL.createObjectURL(imageBlob));

                } catch (error) {
                    console.error("上传或处理图片失败:", error);
                    fileListDiv.innerHTML += `<div style="color: red;">错误：${file.name} - ${error.message}</div>`;
                    // 即使出错，也创建一个占位符，保持图片索引一致
                    processedImages.push('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="150" viewBox="0 0 200 150"><rect fill="#f8d7da" width="200" height="150"/><text x="100" y="75" font-family="Arial" font-size="14" fill="#721c24" text-anchor="middle">图片处理失败</text></svg>');
                }
            }

            loadingSpinner.style.display = 'none';
            selectFilesBtn.disabled = false;

            if (processedImages.length > 0) {
                displayImage(0);
                if (processedImages.length > 1) {
                    paginationDiv.style.display = 'flex'; // 显示翻页器
                }
            } else {
                imageDisplay.alt = '无图片可显示';
            }
        });

        function displayImage(index) {
            if (index >= 0 && index < processedImages.length) {
                currentPageIndex = index;
                imageDisplay.src = processedImages[currentPageIndex];
                imageDisplay.alt = `处理后的图片 ${currentPageIndex + 1}`;
                pageInfoSpan.textContent = `${currentPageIndex + 1} / ${processedImages.length}`;

                prevBtn.disabled = currentPageIndex === 0;
                nextBtn.disabled = currentPageIndex === processedImages.length - 1;
            }
        }

        prevBtn.addEventListener('click', () => {
            if (currentPageIndex > 0) {
                displayImage(currentPageIndex - 1);
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentPageIndex < processedImages.length - 1) {
                displayImage(currentPageIndex + 1);
            }
        });

        // 初始隐藏图片和翻页器
        imageDisplay.style.display = 'none';
        paginationDiv.style.display = 'none';

        // 确保页面加载时显示默认提示
        imageDisplay.addEventListener('load', () => {
            if (imageDisplay.src) {
                imageDisplay.style.display = 'block';
            }
        });
        imageDisplay.addEventListener('error', () => {
            imageDisplay.style.display = 'block'; // 即使错误也显示占位符
        });

    </script>
</body>
</html>
