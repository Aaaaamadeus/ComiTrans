server {
    listen 80;
    server_name amadeuscomic.cn www.amadeuscomic.cn;

    access_log /var/log/nginx/nginx-access.log;
    error_log /var/log/nginx/nginx-error.log;

    # 1. 静态前端资源分发 (Vue/Vite 打包产物)
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. 代理前端对 Vue 中 axios 基础路由 /api 的请求到 SpringBoot 后端
    location /api/ {
        proxy_pass http://web-api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # 处理 CORS 跨域（按需）
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
        add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';
    }

    # 3. 代理直接到大模型处理管道的服务 (FastAPI)
    location /process-image {
        proxy_pass http://ai-worker:8000/process-image;
        proxy_buffering off;
        proxy_read_timeout 300s;
        
        # 设置请求体大小限制以支持大图片上传
        client_max_body_size 50M;
    }

    # 4. 代理 AI Worker 的配置管理接口
    location /config {
        proxy_pass http://ai-worker:8000/config;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
