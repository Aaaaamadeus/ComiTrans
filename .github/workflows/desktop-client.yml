name: Desktop Client Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile desktop client
        run: python -m py_compile run.py comic_translate_core/*.py comic_translate_desktop/*.py comic_translate_desktop/ui/*.py comic-translate-ai/main/*.py scripts/*.py
